
#{extends 'main.html' /}
#{set title:'Principal' /}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header">
        <h1>Logue no site</h1>
    </header>

    <div class="separator"></div>

    <main>
        <div class="form-card">
            <h2>Login</h2>
            <form action="@{Logins.logar}" method="post">
                <div class="form-group">
                    <label for="iEmail">Email:</label>
                    <input type="email" id="iEmail" name="email">
                </div>
                <div class="form-group">
                    <label for="iSenha">Senha:</label>
                    <input type="password" id="iSenha" name="senha">
                </div>
                <button type="submit">entrar</button>
            </form>

            <!-- Cadastro normal de cliente -->
            <a href="@{Gerenciamentos.formCadastro}" class="action-btn" style="display: inline-block; margin-top: 15px;">
                usuario
            </a>

            <!-- NOVO: cadastro de proprietário -->
            <a href="@{Gerenciamentos.formCadastroProprietario}" class="action-btn" style="display: inline-block; margin-top: 8px;">
            proprietario
            </a>
        </div>
    </main>
</body>
</html>
